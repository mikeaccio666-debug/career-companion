<!doctype html>
<html lang="en">
  <body>
    <form id="application-form" class="application--form" action="/embed/job_app">
      <label for="first_name">First Name*</label>
      <input
        id="first_name"
        data-fixture="embed-first-name"
        type="text"
        autocomplete="given-name"
        required
      />

      <label for="email">Email*</label>
      <input id="email" data-fixture="embed-email" type="email" autocomplete="email" required />
    </form>
  </body>
</html>
